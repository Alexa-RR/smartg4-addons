name: Smart-G4 Builder
version: "0.2.0"
slug: smartg4_programmer
description: Program and monitor your Smart-G4 (S-BUS) devices from Home Assistant
url: https://github.com/Alexa-RR/smartg4-addons
arch:
  - aarch64
  - amd64
  - armv7
init: false

# --- Ingress: panel shown inside the Home Assistant sidebar ---
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: S-G4 Builder
panel_admin: true

# S-BUS is UDP broadcast on 6000; the add-on must share the host network so it
# can send/receive LAN broadcasts to/from the RSIP / Z-Audio gateway.
host_network: true

ports:
  6000/udp: null
ports_description:
  6000/udp: S-BUS gateway (leave unset; used on the host network)

map:
  - share:rw          # store device backups (.sbd) under /share/smartg4
  - config:rw

options:
  gateway: "255.255.255.255"
  bus_subnet: 238
  bus_device: 238
  enable_flash_write: false
schema:
  gateway: str
  bus_subnet: int(0,255)
  bus_device: int(1,255)
  # Allow the button programmer to write flash pages back to panels.
  # The restore commit (0xDC16) is experimental — keep off unless you
  # have fresh backups and accept the risk.
  enable_flash_write: bool
